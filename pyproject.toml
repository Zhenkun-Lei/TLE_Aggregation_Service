[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tle-aggregation-service"
version = "0.1.0"
description = "Low-frequency, auditable GP/TLE aggregation service"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "sgp4>=2.20",
    "numpy>=1.20.0",
]

[project.scripts]
tle-aggregate = "tle_aggregation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

